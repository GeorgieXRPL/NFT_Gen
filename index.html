  <script>
    // Cache-busting for all local CSS and JS files
    (function() {
      var version = Date.now();
      // Update CSS links
      document.querySelectorAll('link[rel="stylesheet"]').forEach(function(link) {
        if (link.href && link.href.indexOf('http') !== 0 && link.href.indexOf('?v=') === -1) {
          link.href += (link.href.indexOf('?') === -1 ? '?v=' : '&v=') + version;
        }
      });
      // Update JS scripts
      document.querySelectorAll('script[src]').forEach(function(script) {
        if (script.src && script.src.indexOf('http') !== 0 && script.src.indexOf('?v=') === -1) {
          script.src += (script.src.indexOf('?') === -1 ? '?v=' : '&v=') + version;
        }
      });
    })();
  </script>

  <script>
    // DIFFERENT APPROACH: Use height constraint to freeze tabs
    function freezeTabs() {
      // Freeze Collection Info tab
      const collectionInfo = document.getElementById('collection-info') || document.getElementById('general-info');
      if (collectionInfo) {
        collectionInfo.style.height = 'calc(100vh - 120px)';
        collectionInfo.style.maxHeight = 'calc(100vh - 120px)';
        collectionInfo.style.overflow = 'hidden';
        collectionInfo.style.position = 'relative';
      }
      
      // Freeze Generate NFTs tab
      const generateNfts = document.getElementById('generate-nfts');
      if (generateNfts) {
        generateNfts.style.height = 'calc(100vh - 120px)';
        generateNfts.style.maxHeight = 'calc(100vh - 120px)';
        generateNfts.style.overflow = 'hidden';
        generateNfts.style.position = 'relative';
      }
    }
    
    // Run when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', freezeTabs);
    } else {
      freezeTabs();
    }
    
    // Run every 3 seconds to keep tabs frozen
    setInterval(freezeTabs, 3000);
  </script>

  <script>
    // Initialize the application when the DOM is fully loaded
    document.addEventListener("DOMContentLoaded", function() {
      console.log("DOM content loaded, initializing app...");
      
      // Initialize all modules
      if (window.NFTApp && window.NFTApp.initModules) {
        window.NFTApp.initModules();
      }
      
      // Start with a new project
      if (window.NFTApp && window.NFTApp.getModule && window.NFTApp.getModule("projectService")) {
        window.NFTApp.getModule("projectService").startNew();
      }
    });

      <button id="close-confirmation-modal" style="position:absolute;top:12px;right:12px;background:none;border:none;color:#95a5a6;font-size:28px;cursor:pointer;line-height:1;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:color 0.2s ease;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#95a5a6'">&times;</button>
      <div id="confirmation-message" style="font-size:18px;font-weight:600;color:#ecf0f1;margin-bottom:12px;padding-right:40px;line-height:1.4;"></div>
