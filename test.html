<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Collection Creator - Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
        }
        .test-item {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 5px;
        }
        .success { border-left: 5px solid #4CAF50; }
        .error { border-left: 5px solid #f44336; }
        .warning { border-left: 5px solid #ff9800; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🚀 NFT Collection Creator - Diagnostic Test</h1>
        
        <div class="test-item success">
            <h3>✅ Server Test</h3>
            <p>If you can see this page, the server is working!</p>
            <p>Server URL: <span id="server-url"></span></p>
        </div>
        
        <div class="test-item">
            <h3>🔧 JavaScript Test</h3>
            <button onclick="testJavaScript()">Test JavaScript</button>
            <div id="js-result"></div>
        </div>
        
        <div class="test-item">
            <h3>📁 File Access Test</h3>
            <button onclick="testFileAccess()">Test File Access</button>
            <div id="file-result"></div>
        </div>
        
        <div class="test-item">
            <h3>🎨 Main App Test</h3>
            <button onclick="testMainApp()">Test Main App</button>
            <div id="app-result"></div>
        </div>
        
        <div class="test-item">
            <h3>🛠️ Quick Actions</h3>
            <button onclick="openMainApp()">Open Main App</button>
            <button onclick="runFullDiagnostic()">Run Full Diagnostic</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        // Set server URL
        document.getElementById('server-url').textContent = window.location.href;
        
        function testJavaScript() {
            const result = document.getElementById('js-result');
            try {
                // Test basic JavaScript
                const test = { message: 'JavaScript is working!', timestamp: new Date() };
                result.innerHTML = `<div class="test-item success">✅ JavaScript Test Passed: ${JSON.stringify(test)}</div>`;
            } catch (error) {
                result.innerHTML = `<div class="test-item error">❌ JavaScript Test Failed: ${error.message}</div>`;
            }
        }
        
        function testFileAccess() {
            const result = document.getElementById('file-result');
            
            // Test if we can access the main app
            fetch('index.html')
                .then(response => {
                    if (response.ok) {
                        result.innerHTML = `<div class="test-item success">✅ Main app file accessible</div>`;
                    } else {
                        result.innerHTML = `<div class="test-item error">❌ Main app file not accessible: ${response.status}</div>`;
                    }
                })
                .catch(error => {
                    result.innerHTML = `<div class="test-item error">❌ File access test failed: ${error.message}</div>`;
                });
        }
        
        function testMainApp() {
            const result = document.getElementById('app-result');
            
            // Test if main app components exist
            const tests = [
                { name: 'NFTApp', test: () => typeof window.NFTApp !== 'undefined' },
                { name: 'TraitPathManager', test: () => typeof window.TraitPathManager !== 'undefined' },
                { name: 'Current Project', test: () => typeof window.currentProject !== 'undefined' }
            ];
            
            let results = '<div class="test-item">';
            tests.forEach(test => {
                try {
                    const passed = test.test();
                    results += `<p>${passed ? '✅' : '❌'} ${test.name}: ${passed ? 'Found' : 'Not Found'}</p>`;
                } catch (error) {
                    results += `<p>❌ ${test.name}: Error - ${error.message}</p>`;
                }
            });
            results += '</div>';
            
            result.innerHTML = results;
        }
        
        function openMainApp() {
            window.location.href = 'index.html';
        }
        
        function runFullDiagnostic() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="test-item warning">🔄 Running full diagnostic... Check console for detailed results.</div>';
            
            // Try to run the diagnostic if available
            if (typeof window.runAppDiagnostic === 'function') {
                const diagnosticResults = window.runAppDiagnostic();
                results.innerHTML = `<div class="test-item success">✅ Diagnostic completed. Check console for details.</div>`;
            } else {
                results.innerHTML = `<div class="test-item error">❌ Diagnostic function not available. Main app may not be loaded.</div>`;
            }
        }
        
        function clearResults() {
            document.getElementById('js-result').innerHTML = '';
            document.getElementById('file-result').innerHTML = '';
            document.getElementById('app-result').innerHTML = '';
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-run basic tests
        window.addEventListener('load', function() {
            console.log('🚀 Test page loaded successfully');
            testJavaScript();
            testFileAccess();
        });
    </script>
</body>
</html>
